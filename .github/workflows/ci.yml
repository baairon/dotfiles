name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The installer already carries its own checks; this is what makes them run without
  # someone remembering to. The matrix is the point: the font and shell layers have Linux
  # and macOS branches that a Windows-only author never executes.
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: selftest
        run: node install.mjs --selftest

      - name: installer unit tests
        run: node --test tests/installer.test.mjs

      # A clone has no machine/machine.json, so this is also the fresh-machine path: it must
      # report a plan rather than fall over, and it must never install the optional fonts.
      - name: dry run, writes nothing
        run: node install.mjs --dry-run --repo .

      - name: dry run with the machine layer
        run: node install.mjs --machine --dry-run --repo .

      - name: dry run with the optional fonts
        run: node install.mjs --dry-run --optional-fonts --repo .

      - name: detection status
        run: node install.mjs --list --repo .

      - name: help exits clean
        run: node install.mjs --help

  # The editor config is the largest thing this repo ships and nothing else parses it.
  lua:
    name: lua parses
    runs-on: ubuntu-latest
    # A blocked runner should fail in minutes, not sit on the default six-hour limit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The runner boots with its own apt jobs still holding the dpkg and lists locks, and
      # apt waits on them forever by default while -qq hides the reason. Bound the wait so a
      # lost race is a fast error instead of a hung job.
      - name: install luajit
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq luajit

      # -b compiles without running, so a config that would only fail at editor start-up
      # fails here instead. No style opinions, syntax only.
      - name: parse every lua file
        run: |
          fail=0
          while IFS= read -r f; do
            if luajit -bl "$f" /dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done < <(find nvim tests -name '*.lua' -print | sort)
          exit $fail

  # Parsing proves the config loads; this proves it behaves. Running it on Linux is the point,
  # the same reason the installer job is a matrix: these take the non-Windows branches in
  # splash.lua and diff.lua that a Windows-only author never executes.
  nvim:
    name: editor runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Ubuntu ships a Neovim older than this config's floor, and the appimage wants FUSE on
      # the runner, so take the release tarball at a pinned version and keep it out of the
      # checkout, which the tests read as the repo root.
      - name: install neovim
        env:
          NVIM_VERSION: v0.12.5
        run: |
          mkdir -p "$RUNNER_TEMP/nvim"
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP/nvim" --strip-components=1
          echo "$RUNNER_TEMP/nvim/bin" >> "$GITHUB_PATH"

      - name: version
        run: nvim --version | head -1

      # -l exits nonzero on an uncaught error, so a failed check fails the job.
      - name: runtime checks
        run: nvim --headless -u NONE -l tests/runtime.lua

      # Attaches a real UI to a child editor and resizes it, which is the only way to catch
      # the splash keeping a stale buffer length after the terminal shrinks.
      - name: splash resize checks
        run: nvim --headless -u NONE -l tests/ui.lua

  # Everything the repo promises about what it does not publish, asserted rather than trusted.
  privacy:
    name: nothing tracked names a machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: no per-machine files are tracked
        run: |
          for f in machine/machine.json machine/NOTES.local.md .claude/settings.local.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "tracked but must not be: $f"
              exit 1
            fi
          done
          echo "none of the per-machine files are tracked"

      - name: the tracked example manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('machine/machine.example.json','utf8'))"
